<!doctype html>
<html lang="no" id="html">
<head>
<meta charset="utf-8" />
<title>Rawskap Transfer</title>
<style>
  :root { --bg:#f5f0eb; --fg:#1d1d1f; --svak:rgba(29,29,31,.6); --svakere:rgba(29,29,31,.4); --kort:#fff; --kant:rgba(29,29,31,.12); --flate:rgba(29,29,31,.045); --grønn:#325f4e; --rød:#b03030; --side:#ece6df; }
  @media (prefers-color-scheme: dark) { :root { --bg:#3d3d3d; --fg:#ece9e4; --svak:rgba(236,233,228,.6); --svakere:rgba(236,233,228,.4); --kort:#4a4a4a; --kant:rgba(255,255,255,.12); --flate:rgba(255,255,255,.06); --side:#353535; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:13.5px; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--grønn); color:#f5f0eb; flex:0 0 auto; }
  header .logo { font-family:Georgia,serif; font-weight:700; font-size:20px; letter-spacing:-.01em; }
  header .logo small { font-weight:400; font-size:12px; opacity:.75; margin-left:6px; letter-spacing:.08em; text-transform:uppercase; }
  header .høyre { margin-left:auto; font-size:12.5px; opacity:.9; display:flex; gap:10px; align-items:center; }
  header button { background:none; border:1px solid rgba(245,240,235,.4); color:#f5f0eb; border-radius:4px; padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .skall { flex:1; display:grid; grid-template-columns:240px minmax(0,1fr); min-height:0; }
  aside { background:var(--side); border-right:1px solid var(--kant); overflow:auto; padding:10px 8px; }
  aside .tre button { width:100%; text-align:left; background:none; border:none; color:inherit; font:inherit; padding:6px 9px; border-radius:6px; cursor:pointer; display:flex; gap:8px; align-items:center; white-space:nowrap; }
  aside .tre button:hover { background:rgba(50,95,78,.1); }
  aside .tre button.valgt { background:var(--grønn); color:#f5f0eb; }
  aside .tre .dybde1 { padding-left:26px; } aside .tre .dybde2 { padding-left:42px; } aside .tre .dybde3 { padding-left:58px; } aside .tre .dybde4 { padding-left:74px; }
  aside .tre small { margin-left:auto; font-size:11px; opacity:.6; }
  .hoved { display:flex; flex-direction:column; min-height:0; }
  .verktøy { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--kant); flex:0 0 auto; flex-wrap:wrap; row-gap:8px; }
  .verktøy h2 { flex:1 1 160px; }
  .verktøy h2 { font-family:Georgia,serif; font-size:18px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .verktøy .meta { font-size:12.5px; color:var(--svak); white-space:nowrap; }
  .btn { padding:8px 14px; border-radius:7px; border:1px solid var(--kant); background:transparent; color:inherit; font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn.primær { background:var(--grønn); color:#f5f0eb; border-color:var(--grønn); }
  .btn.farlig { color:var(--rød); border-color:var(--rød); }
  .btn.liten { padding:4px 10px; font-size:12px; font-weight:500; }
  .btn:disabled { opacity:.45; cursor:default; }
  .maalnavn { font-weight:400; color:var(--svak); }
  .bryter { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--svak); cursor:pointer; user-select:none; }
  .filer { flex:1; overflow:auto; padding:6px 10px; }
  .filrad { display:grid; grid-template-columns:1fr 100px 90px; gap:12px; align-items:center; padding:7px 8px; border-radius:6px; font-size:13px; }
  .filrad:hover { background:var(--flate); }
  .filrad.hode { color:var(--svak); font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; position:sticky; top:0; background:var(--bg); }
  .filrad .navn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .filrad .navn small { color:var(--svakere); margin-left:6px; font-size:11px; }
  .filrad .tall { text-align:right; font-variant-numeric:tabular-nums; color:var(--svak); }
  .filrad .hent { text-align:right; }
  .filrad .hent button { opacity:0; }
  .filrad:hover .hent button { opacity:1; }
  .tom { padding:40px; text-align:center; color:var(--svak); }
  /* Overføringer — linja nederst (Frame.io-modellen) */
  .overf { flex:0 0 auto; border-top:1px solid var(--kant); background:var(--kort); }
  .overf-linje { display:flex; align-items:center; gap:12px; padding:9px 18px; cursor:pointer; user-select:none; }
  .overf-linje strong { font-size:13px; }
  .overf-linje .bar { flex:1; height:6px; background:rgba(29,29,31,.1); border-radius:999px; overflow:hidden; max-width:420px; }
  .overf-linje .bar i { display:block; height:100%; background:var(--grønn); width:0; transition:width .2s; }
  .overf-linje .tekst { font-size:12.5px; color:var(--svak); }
  .overf-linje .pil { margin-left:auto; color:var(--svakere); font-size:12px; margin-right:8px; }
  .overf-panel { display:none; max-height:42vh; overflow:auto; border-top:1px solid var(--kant); padding:6px 10px 10px; }
  .overf.åpen .overf-panel { display:block; }
  .jobb { border:1px solid var(--kant); border-radius:9px; padding:8px 12px; margin:6px 0; }
  .jobb-hode { display:grid; grid-template-columns:1fr 220px 170px auto; gap:12px; align-items:center; cursor:pointer; }
  .jobb-hode .navn { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jobb-hode .navn small { font-weight:400; color:var(--svak); margin-left:6px; }
  .jobb-hode .bar { height:6px; background:rgba(29,29,31,.1); border-radius:999px; overflow:hidden; }
  .jobb-hode .bar i { display:block; height:100%; background:var(--grønn); width:0; transition:width .2s; }
  .jobb-hode .status { font-size:12px; color:var(--svak); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .jobb-hode .rad { position:relative; }
  .meny { position:absolute; right:0; top:calc(100% + 4px); background:var(--kort); border:1px solid var(--kant); border-radius:9px; box-shadow:0 12px 30px rgba(0,0,0,.25); padding:5px; min-width:210px; z-index:5; display:none; }
  .meny.åpen { display:block; }
  .meny button { display:block; width:100%; text-align:left; background:none; border:none; color:inherit; font:inherit; font-size:13px; padding:8px 10px; border-radius:6px; cursor:pointer; }
  .meny button:hover { background:var(--flate); }
  .meny hr { border:0; border-top:1px solid var(--kant); margin:4px 0; }
  .jobb-filer { display:none; margin-top:8px; max-height:220px; overflow:auto; }
  .jobb.åpen .jobb-filer { display:block; }
  .fil { display:grid; grid-template-columns:1fr 90px 130px; gap:10px; align-items:center; font-size:12px; padding:3px 6px; border-radius:5px; }
  .fil .navn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fil .bar { height:5px; background:rgba(29,29,31,.1); border-radius:999px; overflow:hidden; }
  .fil .bar i { display:block; height:100%; background:var(--grønn); width:0; }
  .fil.ferdig .bar i, .fil.hoppet .bar i { width:100%; } .fil.hoppet .bar i { background:var(--svakere); }
  .fil.feil { color:var(--rød); }
  .fil .status { text-align:right; color:var(--svak); font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* Kobling */
  .kobling { max-width:560px; margin:60px auto; background:var(--kort); border:1px solid var(--kant); border-radius:12px; padding:22px 24px; }
  .kobling h2 { font-family:Georgia,serif; font-size:20px; margin:0 0 6px; }
  .kobling p { color:var(--svak); line-height:1.5; margin:0 0 14px; }
  label { display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--svak); margin:10px 0 5px; font-weight:700; }
  input[type=text], input[type=password] { width:100%; padding:9px 11px; border:1px solid var(--kant); border-radius:7px; background:transparent; color:inherit; font:inherit; }
  .rad { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hjelp { font-size:12px; color:var(--svakere); }
  .skjult { display:none !important; }
  .kmeny { position:fixed; z-index:50; background:var(--kort); border:1px solid var(--kant); border-radius:9px; box-shadow:0 12px 30px rgba(0,0,0,.3); padding:5px; min-width:220px; display:none; }
  .kmeny.åpen { display:block; }
  .kmeny .tittel { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--svakere); padding:6px 10px 4px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px; }
  .kmeny button { display:block; width:100%; text-align:left; background:none; border:none; color:inherit; font:inherit; font-size:13px; padding:8px 10px; border-radius:6px; cursor:pointer; }
  .kmeny button:hover { background:var(--flate); }
  .kmeny hr { border:0; border-top:1px solid var(--kant); margin:4px 0; }
  .filrad.mappe { cursor:pointer; font-weight:600; }
  .filrad.mappe .navn::before { content:'📁 '; }
  .prompt-bak { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; }
  .prompt-bak.åpen { display:flex; }
  .prompt { background:var(--kort); border-radius:12px; padding:18px 20px; width:min(420px, 90vw); border:1px solid var(--kant); }
  .prompt h3 { margin:0 0 4px; font-family:Georgia,serif; font-size:17px; }
  .prompt p { margin:0 0 10px; color:var(--svak); font-size:12.5px; }
  .kode { font-family:ui-monospace,monospace; font-size:22px; letter-spacing:.15em; font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="logo">rawskap<small>transfer · v0</small></div>
  <div class="høyre"><span id="konto"></span><button id="logg-ut" class="skjult" data-t="loggUt" title="Logger appen ut av kontoen — stopper også overføringer">Logg ut</button></div>
</header>

<section id="steg-kobling" class="kobling">
  <h2 data-t="koble">Koble til skapet</h2>
  <p data-t="kobleTekst">Logg inn i nettleseren — slik du pleier (e-post, Google eller Microsoft) — og trykk «Koble til» der. Appen kobles automatisk. Ingenting å kopiere.</p>
  <div class="rad">
    <button class="btn primær" id="logg-inn" data-t="loggInn">Logg inn i nettleseren</button>
    <span id="kode-visning" class="kode skjult"></span>
    <span id="kobling-status" class="hjelp"></span>
  </div>
  <details style="margin-top:16px">
    <summary class="hjelp" style="cursor:pointer" data-t="avansert">Avansert: annen adresse eller nøkkel</summary>
    <label data-t="adresse">Rawskap-adresse</label>
    <input type="text" id="portal" value="https://rawskap.no" />
    <label data-t="nokkel">Nøkkel (app-nøkkel eller API-nøkkel)</label>
    <input type="password" id="nokkel" placeholder="…" />
    <div class="rad" style="margin-top:12px"><button class="btn" id="koble" data-t="kobleNokkel">Koble til med nøkkel</button><span id="kobling-feil" class="hjelp"></span></div>
  </details>
</section>

<div id="skall" class="skall skjult">
  <aside><div class="tre" id="tre"></div></aside>
  <div class="hoved">
    <div class="verktøy">
      <h2 id="mappe-tittel"></h2>
      <span class="meta" id="mappe-meta"></span>
      <button class="btn liten" id="ny-mappe" data-t="nyMappe">+ Ny mappe</button>
      <button class="btn" id="last-opp-filer" title=""><span data-t="lastOppFiler">⤒ Last opp filer</span> <span class="maalnavn" id="opp-maal-1"></span></button>
      <button class="btn" id="last-opp-mappe" title=""><span data-t="lastOppMappe">⤒ Last opp mappe</span> <span class="maalnavn" id="opp-maal-2"></span></button>
      <button class="btn primær" id="last-ned-mappe" data-t="lastNedMappe" title="Inkludert undermapper">⤓ Last ned mappa</button>
    </div>
    <div class="filer" id="filer"></div>
  </div>
</div>

<div id="overf" class="overf skjult">
  <div class="overf-linje" id="overf-linje">
    <strong>⇅ <span data-t="overforinger">Overføringer</span></strong>
    <div class="bar"><i id="overf-bar"></i></div>
    <span class="tekst" id="overf-tekst" data-t="ingenOverf">Ingen overføringer</span>
    <span class="pil" id="overf-pil">▲</span>
    <label class="bryter" style="margin:0" onclick="event.stopPropagation()"><input type="checkbox" id="logg-bryter" /> <span data-t="skrivLogg">Skriv logg</span></label>
    <button class="btn liten" id="velg-maal" onclick="event.stopPropagation()"><span data-t="til">Last ned til</span>: <span id="maal-navn">…</span></button>
  </div>
  <div class="overf-panel" id="overf-panel"></div>
</div>

<div class="kmeny" id="kmeny"></div>
<div class="prompt-bak" id="prompt-bak"><div class="prompt"><h3 id="prompt-tittel"></h3><p id="prompt-tekst"></p><input type="text" id="prompt-felt" /><div class="rad" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="prompt-avbryt" data-t="avbrytKnapp">Avbryt</button><button class="btn primær" id="prompt-ok">OK</button></div></div></div>
<script type="module">
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const { open } = window.__TAURI__.dialog;
  const { open: openShell } = window.__TAURI__.shell;
  const { load } = window.__TAURI__.store;

  const EN = { koble: 'Connect to your library', kobleTekst: 'Sign in in the browser — as you usually do (e-mail, Google or Microsoft) — and press “Connect” there. The app connects by itself. Nothing to copy.', loggInn: 'Sign in in the browser', avansert: 'Advanced: other address or key', adresse: 'Rawskap address', nokkel: 'Key (app key or API key)', kobleNokkel: 'Connect with key', til: 'Download to', lastNedMappe: '⤓ Download folder', iUndermapper: 'in subfolders', nyMappe: '+ New folder', nyMappeTittel: 'New folder', nyMappeTekst: 'Created inside', mappenavn: 'Folder name …', avbrytKnapp: 'Cancel', her: 'here', oppTilMappe: 'Uploads go to', lastOppHit: '⤒ Upload files here', lastOppMappeHit: '⤒ Upload folder here', lastNedDenne: '⤓ Download this folder', apneMappe: 'Open', iRawskap: 'Open in Rawskap', lastOppFiler: '⤒ Upload files', lastOppMappe: '⤒ Upload folder', oppTil: 'to', opplasting: 'upload', videoUtenPoster: 'Videos get no poster image in this version — the card shows a file icon until the library processes it.', overforinger: 'Transfers', ingenOverf: 'No transfers', loggUt: 'Sign out', skrivLogg: 'Write log',
    lager: 'Creating code …', bekreft: 'Confirm the code in the browser …', koblet: 'Connected ✓', utlop: 'The code expired — try again.', forLang: 'Took too long — try again.', forrige: 'The previous connection no longer works — sign in again.', velgMaal: 'Download to', hele: 'Whole library', mapper: 'folders', filer: 'files', fil: 'file', tomMappe: 'No files in this folder.', navn: 'Name', storrelse: 'Size', hent: 'Download', venter: 'waiting', laDer: 'was there', ferdig: 'done', feilet: 'failed', avbrutt: 'cancelled', iKo: 'queued', avbryt: 'Cancel', apneRawskap: 'Open in Rawskap', visUtforsker: 'Show in File Explorer', visLogg: 'Show log', fjern: 'Remove from list', provIgjen: 'Try again', velgMaalForst: 'Pick a download folder first' };
  const NO = { til: 'Last ned til', iUndermapper: 'i undermapper', nyMappe: '+ Ny mappe', nyMappeTittel: 'Ny mappe', nyMappeTekst: 'Lages i', mappenavn: 'Mappenavn …', her: 'hit', oppTilMappe: 'Lastes opp til', lastOppHit: '⤒ Last opp filer hit', lastOppMappeHit: '⤒ Last opp mappe hit', lastNedDenne: '⤓ Last ned denne mappa', apneMappe: 'Åpne', iRawskap: 'Åpne i Rawskap', oppTil: 'til', opplasting: 'opplasting', videoUtenPoster: 'Video får ikke plakatbilde i denne versjonen — kortet viser filikon til skapet har behandlet den.', lager: 'Lager kode …', bekreft: 'Bekreft koden i nettleseren …', koblet: 'Koblet ✓', utlop: 'Koden utløp — prøv igjen.', forLang: 'Tok for lang tid — prøv igjen.', forrige: 'Forrige kobling virker ikke lenger — logg inn på nytt.', velgMaal: 'Last ned til', hele: 'Hele skapet', mapper: 'mapper', filer: 'filer', fil: 'fil', tomMappe: 'Ingen filer i denne mappa.', navn: 'Navn', storrelse: 'Størrelse', hent: 'Last ned', venter: 'venter', laDer: 'lå der', ferdig: 'ferdig', feilet: 'feilet', avbrutt: 'avbrutt', iKo: 'i kø', avbryt: 'Avbryt', apneRawskap: 'Åpne i Rawskap', visUtforsker: 'Vis i Utforsker', visLogg: 'Vis logg', fjern: 'Fjern fra lista', provIgjen: 'Prøv igjen', velgMaalForst: 'Velg en nedlastingsmappe først', ingenOverf: 'Ingen overføringer' };
  const erNo = /^(nb|nn|no|da|sv)/i.test(navigator.language || '');
  const t = erNo ? NO : EN;
  if (!erNo) { document.getElementById('html').lang = 'en'; document.querySelectorAll('[data-t]').forEach(el => { const v = EN[el.dataset.t]; if (v) el.textContent = v; }); }

  const $ = id => document.getElementById(id);
  const fmt = b => b >= 1e9 ? `${(b/1e9).toFixed(2)} GB` : b >= 1e6 ? `${(b/1e6).toFixed(1)} MB` : `${Math.round(b/1e3)} kB`;
  const store = await load('transfer.json', { autoSave: true });
  let portal = '', nokkel = '', data = null, valgtMappe = '', maal = '';

  await invoke('avbryt');

  // ── Kobling ──
  const lagret = await store.get('kobling');
  if (lagret?.nokkel) { $('portal').value = lagret.portal; $('nokkel').value = lagret.nokkel; }
  maal = (await store.get('maal')) || '';
  $('logg-bryter').checked = !!(await store.get('logg'));
  $('logg-bryter').onchange = () => store.set('logg', $('logg-bryter').checked);
  const visMaal = () => { $('maal-navn').textContent = maal ? maal.split(/[\\/]/).filter(Boolean).slice(-1)[0] : '…'; $('velg-maal').title = maal; };
  visMaal();
  async function kobleMed(p, n) {
    portal = p.trim().replace(/\/$/, ''); nokkel = n.trim();
    data = await invoke('hent_liste', { portal, nokkel, mappe: '' });
    await store.set('kobling', { portal, nokkel });
    $('konto').textContent = `${data.mapper.length} ${t.mapper} · ${data.filer.length} ${t.filer} · ${fmt(data.totalBytes)}`;
    $('logg-ut').classList.remove('skjult');
    $('steg-kobling').classList.add('skjult'); $('skall').classList.remove('skjult'); $('overf').classList.remove('skjult');
    tegnTre(); velgMappe('');
  }
  $('logg-inn').onclick = async () => {
    const p = ($('portal').value || 'https://rawskap.no').trim().replace(/\/$/, '');
    $('logg-inn').disabled = true; $('kobling-status').textContent = t.lager;
    try {
      const d = await invoke('kobling_start', { portal: p, maskin: await invoke('maskinnavn') });
      if (!d.ok) throw new Error(d.error || 'Kunne ikke lage kode');
      $('kode-visning').textContent = d.kode.slice(0, 3) + '-' + d.kode.slice(3); $('kode-visning').classList.remove('skjult');
      $('kobling-status').textContent = t.bekreft;
      openShell(p + (/rawskap\.no/.test(p) ? '/app' : '/rawskap/app') + '?kode=' + d.kode);
      for (let i = 0; i < 300; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const s = await invoke('kobling_poll', { portal: p, kode: d.kode });
        if (s.ok && s.nokkel) { $('kobling-status').textContent = t.koblet; await kobleMed(p, s.nokkel); return; }
        if (s.utlopt) throw new Error(t.utlop);
      }
      throw new Error(t.forLang);
    } catch (e) { $('kobling-status').textContent = String(e.message || e); $('kode-visning').classList.add('skjult'); }
    finally { $('logg-inn').disabled = false; }
  };
  $('koble').onclick = async () => { $('kobling-feil').textContent = ''; $('koble').disabled = true; try { await kobleMed($('portal').value, $('nokkel').value); } catch (e) { $('kobling-feil').textContent = String(e); } finally { $('koble').disabled = false; } };
  $('logg-ut').onclick = async () => { await invoke('avbryt'); await new Promise(r => setTimeout(r, 400)); await store.delete('kobling'); location.reload(); };
  if (lagret?.nokkel) { try { await kobleMed(lagret.portal, lagret.nokkel); } catch (e) { $('kobling-status').textContent = t.forrige; } }

  // ── Egen prompt (aldri nativ) ──
  function spor(tittel, tekst, plassholder) {
    return new Promise(res => {
      $('prompt-tittel').textContent = tittel; $('prompt-tekst').textContent = tekst; $('prompt-felt').value = ''; $('prompt-felt').placeholder = plassholder || '';
      $('prompt-bak').classList.add('åpen'); setTimeout(() => $('prompt-felt').focus(), 30);
      const lukk = v => { $('prompt-bak').classList.remove('åpen'); res(v); };
      $('prompt-ok').onclick = () => lukk($('prompt-felt').value.trim());
      $('prompt-avbryt').onclick = () => lukk(null);
      $('prompt-felt').onkeydown = e => { if (e.key === 'Enter') lukk($('prompt-felt').value.trim()); if (e.key === 'Escape') lukk(null); };
      $('prompt-bak').onclick = e => { if (e.target === $('prompt-bak')) lukk(null); };
    });
  }
  async function nyMappe(forelder) {
    const navn = await spor(t.nyMappeTittel, `${t.nyMappeTekst} «${mappeNavn(forelder)}»`, t.mappenavn);
    if (!navn) return;
    try { const d = await invoke('ny_mappe', { portal, nokkel, navn, forelder: forelder || '' }); data.mapper.push({ id: d.id, navn, forelderId: forelder || '' }); velgMappe(d.id); }
    catch (e) { $('overf-tekst').textContent = String(e); $('overf').classList.add('åpen'); }
  }
  // ── Høyreklikk: egen meny (nettleserens er skjult) ──
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('click', () => $('kmeny').classList.remove('åpen'));
  function visKmeny(x, y, tittel, valg) {
    const m = $('kmeny'); m.innerHTML = '';
    const tt = document.createElement('div'); tt.className = 'tittel'; tt.textContent = tittel; m.appendChild(tt);
    for (const v of valg) { if (v === '-') { m.appendChild(document.createElement('hr')); continue; } const b = document.createElement('button'); b.textContent = v[0]; b.onclick = () => { m.classList.remove('åpen'); v[1](); }; m.appendChild(b); }
    m.classList.add('åpen');
    const r = m.getBoundingClientRect(); m.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px'; m.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
  }
  function mappeMeny(e, id) {
    e.preventDefault(); e.stopPropagation();
    visKmeny(e.clientX, e.clientY, mappeNavn(id), [
      [t.nyMappe.replace(/^\+ /, ''), () => nyMappe(id)],
      [t.lastOppHit, () => { velgMappe(id); $('last-opp-filer').click(); }],
      [t.lastOppMappeHit, () => { velgMappe(id); $('last-opp-mappe').click(); }],
      '-',
      [t.lastNedDenne, async () => { const d = await invoke('hent_liste', { portal, nokkel, mappe: id }); startJobb(mappeNavn(id), d.filer, id, true); }],
      [t.iRawskap, () => openShell(portal + (/rawskap\.no/.test(portal) ? '' : '/rawskap') + (id ? `?mappe=${id}` : ''))],
    ]);
  }
  $('ny-mappe').onclick = () => nyMappe(valgtMappe);
  $('filer').addEventListener('contextmenu', e => { if (!e.target.closest('.filrad')) mappeMeny(e, valgtMappe); });

  // ── Mappetre + filer ──
  const mappeNavn = id => id ? (data.mapper.find(m => m.id === id)?.navn || '') : t.hele;
  const underMapper = rot => { const forelder = new Map(data.mapper.map(m => [m.id, m.forelderId || ''])); const s = new Set(); for (const m of data.mapper) { let k = m.id, v = 0, treff = !rot; while (k && v++ < 30 && !treff) { if (k === rot) treff = true; k = forelder.get(k) || ''; } if (treff) s.add(m.id); } return s; };
  function tegnTre() {
    const tre = $('tre'); tre.innerHTML = '';
    const barnAv = id => data.mapper.filter(m => (m.forelderId || '') === id).sort((a, b) => a.navn.localeCompare(b.navn, 'nb'));
    const antall = new Map(); for (const f of data.filer) antall.set(f.mappeId || '', (antall.get(f.mappeId || '') || 0) + 1);
    const rad = (id, navn, dybde) => {
      const b = document.createElement('button'); b.className = `dybde${Math.min(dybde, 4)}` + (id === valgtMappe ? ' valgt' : '');
      const n = id ? antall.get(id) || 0 : data.filer.length;
      b.innerHTML = `<span>${dybde === 0 ? '🗄' : '📁'}</span><span style="overflow:hidden;text-overflow:ellipsis">${navn}</span>${n ? `<small>${n}</small>` : ''}`;
      b.onclick = () => velgMappe(id);
      b.oncontextmenu = e => mappeMeny(e, id);
      tre.appendChild(b);
      for (const m of barnAv(id)) rad(m.id, m.navn, dybde + 1);
    };
    rad('', t.hele, 0);
  }
  function velgMappe(id) {
    valgtMappe = id; tegnTre();
    const under = underMapper(id);
    const alle = data.filer.filter(f => id ? under.has(f.mappeId) : true);
    const filer = data.filer.filter(f => (f.mappeId || '') === id); // kun DIREKTE i mappa — undermapper er rader
    $('mappe-tittel').textContent = mappeNavn(id);
    const iUnder = alle.length - filer.length;
    $('mappe-meta').textContent = `${filer.length} ${filer.length === 1 ? t.fil : t.filer} · ${fmt(filer.reduce((s, f) => s + f.bytes, 0))}${iUnder ? ` · +${iUnder} ${t.iUndermapper}` : ''}`;
    $('opp-maal-1').textContent = `→ ${mappeNavn(id)}`; $('opp-maal-2').textContent = `→ ${mappeNavn(id)}`;
    $('last-opp-filer').title = `${t.oppTilMappe} «${mappeNavn(id)}»`; $('last-opp-mappe').title = `${t.oppTilMappe} «${mappeNavn(id)}»`;
    const el = $('filer'); el.innerHTML = '';
    const barn = data.mapper.filter(m => (m.forelderId || '') === id).sort((a, b) => a.navn.localeCompare(b.navn, 'nb'));
    if (!filer.length && !barn.length) { el.innerHTML = `<div class="tom">${t.tomMappe}</div>`; return; }
    el.innerHTML = `<div class="filrad hode"><span>${t.navn}</span><span class="tall">${t.storrelse}</span><span></span></div>`;
    // Undermapper som rader øverst (Frame.io-modellen): klikk → inn i mappa.
    const bytesI = new Map(); for (const f of data.filer) bytesI.set(f.mappeId || '', (bytesI.get(f.mappeId || '') || 0) + f.bytes);
    const underAv = mid => { const u = underMapper(mid); let b = 0; for (const [k, v] of bytesI) if (u.has(k)) b += v; return b; };
    for (const m of barn) { const r = document.createElement('div'); r.className = 'filrad mappe'; r.innerHTML = `<span class="navn">${m.navn}</span><span class="tall">${fmt(underAv(m.id))}</span><span class="hent"><button class="btn liten">${t.apneMappe} ›</button></span>`; r.onclick = () => velgMappe(m.id); r.oncontextmenu = e => mappeMeny(e, m.id); el.appendChild(r); }
    for (const f of filer.slice(0, 2000)) {
      const r = document.createElement('div'); r.className = 'filrad';
      r.innerHTML = `<span class="navn" title="${f.filnavn}">${f.filnavn}</span><span class="tall">${fmt(f.bytes)}</span><span class="hent"><button class="btn liten">⤓ ${t.hent}</button></span>`;
      r.querySelector('button').onclick = () => startJobb(f.filnavn, [{ ...f, sti: '' }], f.mappeId, false);
      el.appendChild(r);
    }
  }
  $('velg-maal').onclick = async () => { const v = await open({ directory: true, multiple: false, title: t.velgMaal }); if (v) { maal = v; await store.set('maal', v); visMaal(); } };
  const lokalNavn = s => s.split(/[\\/]/).filter(Boolean).slice(-1)[0] || s;
  $('last-opp-filer').onclick = async () => {
    const v = await open({ multiple: true, directory: false, title: t.lastOppFiler });
    const liste = Array.isArray(v) ? v : v ? [v] : []; if (!liste.length) return;
    const filer = []; for (const sti of liste) { const l = await invoke('les_mappe', { sti: sti.replace(/[\\/][^\\/]+$/, '') }); const f = l.find(x => x.sti === sti); if (f) filer.push({ sti: f.sti, relativ: lokalNavn(f.sti), bytes: f.bytes, filnavn: lokalNavn(f.sti), id: f.sti }); }
    if (filer.some(f => /\.(mp4|mov|mxf|avi|mkv)$/i.test(f.filnavn))) $('overf-tekst').textContent = t.videoUtenPoster;
    startJobb(`${filer.length === 1 ? filer[0].filnavn : filer.length + ' ' + t.filer} → ${mappeNavn(valgtMappe)}`, filer, valgtMappe, false, 'opp');
  };
  $('last-opp-mappe').onclick = async () => {
    const v = await open({ directory: true, multiple: false, title: t.lastOppMappe }); if (!v) return;
    const l = await invoke('les_mappe', { sti: v }); if (!l.length) return;
    const navn = lokalNavn(v);
    // Mappa selv gjenskapes i skapet under valgt mappe (relativ sti får mappenavnet som rot).
    const filer = l.map(f => ({ sti: f.sti, relativ: navn + '/' + f.relativ, bytes: f.bytes, filnavn: lokalNavn(f.sti), id: f.sti }));
    startJobb(`${navn} → ${mappeNavn(valgtMappe)}`, filer, valgtMappe, false, 'opp');
  };
  $('last-ned-mappe').onclick = async () => { const d = await invoke('hent_liste', { portal, nokkel, mappe: valgtMappe }); startJobb(mappeNavn(valgtMappe), d.filer, valgtMappe, true); };

  // ── Overføringer: jobbkø, én jobb om gangen (3 strømmer) ──
  const jobber = []; let aktiv = null;
  const filTilstand = new Map();
  $('overf-linje').onclick = () => $('overf').classList.toggle('åpen');
  document.addEventListener('click', e => { if (!e.target.closest('.meny') && !e.target.closest('.meny-knapp')) document.querySelectorAll('.meny.åpen').forEach(m => m.classList.remove('åpen')); });
  function startJobb(navn, filer, mappeId, erMappe, type = 'ned') {
    if (!maal) { $('overf').classList.add('åpen'); $('overf-tekst').textContent = t.velgMaalForst; $('velg-maal').click(); return; }
    const j = { id: 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), type, navn, mappeId, filer: type === 'opp' ? filer : filer.map(f => ({ id: f.id, filnavn: f.filnavn, bytes: f.bytes, sti: f.sti || '' })), maal: erMappe && mappeId ? `${maal}/${navn.replace(/[\\/:*?"<>|]+/g, '_')}` : maal, status: 'kø', ok: 0, feil: [], logg: $('logg-bryter').checked };
    jobber.unshift(j); tegnJobber(); $('overf').classList.add('åpen'); kjørNeste();
  }
  async function kjørNeste() {
    if (aktiv) return;
    const j = jobber.find(x => x.status === 'kø'); if (!j) { oppdaterLinje(); return; }
    aktiv = j; j.status = 'laster'; tegnJobber();
    try {
      const res = j.type === 'opp'
        ? await invoke('last_opp', { portal, nokkel, filer: j.filer.map(f => ({ sti: f.sti, relativ: f.relativ, bytes: f.bytes })), mappeId: j.mappeId || '', parallell: 3 })
        : await invoke('last_ned', { portal, nokkel, filer: j.filer, maal: j.maal, parallell: 3, logg: j.logg, jobbnavn: j.navn });
      if (j.type === 'opp') { try { data = await invoke('hent_liste', { portal, nokkel, mappe: '' }); $('konto').textContent = `${data.mapper.length} ${t.mapper} · ${data.filer.length} ${t.filer} · ${fmt(data.totalBytes)}`; velgMappe(valgtMappe); } catch { /* */ } }
      j.ok = res.ok; j.feil = res.feil || [];
      j.status = j.feil.some(f => /^Avbrutt$/i.test(f.feil || '')) ? 'avbrutt' : j.feil.length ? 'feil' : 'ferdig';
    } catch (e) { j.status = 'feil'; j.feil = [{ feil: String(e) }]; }
    aktiv = null; tegnJobber(); kjørNeste();
  }
  await listen('framdrift', ev => {
    const p = ev.payload; filTilstand.set(p.id, p);
    const el = document.getElementById('f-' + p.id);
    if (el) { el.className = 'fil ' + p.status; el.querySelector('.bar i').style.width = p.status === 'ferdig' || p.status === 'hoppet' ? '100%' : `${p.total ? Math.min(100, p.hentet / p.total * 100) : 0}%`; el.querySelector('.status').textContent = p.status === 'ferdig' ? `✓ ${t.ferdig}` : p.status === 'hoppet' ? `✓ ${t.laDer}` : p.status === 'feil' ? `✕ ${p.feil || t.feilet}` : `${fmt(p.hentet)} / ${fmt(p.total)}`; }
    oppdaterJobbBar(); oppdaterLinje();
  });
  const jobbTall = j => { let hentet = 0, ferdig = 0; const total = j.filer.reduce((s, f) => s + f.bytes, 0); for (const f of j.filer) { const s = filTilstand.get(f.id); if (!s) continue; if (s.status === 'ferdig' || s.status === 'hoppet') { hentet += f.bytes; ferdig++; } else if (s.status !== 'feil') hentet += s.hentet; } return { hentet, total, ferdig }; };
  function oppdaterJobbBar() { if (!aktiv) return; const el = document.getElementById('jb-' + aktiv.id); if (!el) return; const k = jobbTall(aktiv); el.querySelector('.bar i').style.width = k.total ? `${Math.min(100, k.hentet / k.total * 100)}%` : '0%'; el.querySelector('.status').textContent = `${k.ferdig} / ${aktiv.filer.length} · ${fmt(k.hentet)} / ${fmt(k.total)}`; }
  function oppdaterLinje() {
    if (aktiv) { const k = jobbTall(aktiv); $('overf-bar').style.width = k.total ? `${Math.min(100, k.hentet / k.total * 100)}%` : '0%'; const kø = jobber.filter(j => j.status === 'kø').length; $('overf-tekst').textContent = `${aktiv.navn} · ${fmt(k.hentet)} / ${fmt(k.total)}${kø ? ` · +${kø} ${t.iKo}` : ''}`; }
    else { $('overf-bar').style.width = jobber.length ? '100%' : '0%'; const f = jobber.filter(j => j.status === 'ferdig').length; $('overf-tekst').textContent = jobber.length ? `${f} ${t.ferdig}${jobber.length - f ? ` · ${jobber.length - f} ${t.feilet}/${t.avbrutt}` : ''}` : t.ingenOverf; }
  }
  function tegnJobber() {
    const p = $('overf-panel'); p.innerHTML = '';
    for (const j of jobber) {
      const el = document.createElement('div'); el.className = 'jobb' + (j === aktiv ? ' åpen' : ''); el.id = 'jb-' + j.id;
      const k = jobbTall(j);
      const statusTekst = j.status === 'kø' ? t.iKo : j.status === 'laster' ? `${k.ferdig} / ${j.filer.length} · ${fmt(k.hentet)} / ${fmt(k.total)}` : j.status === 'ferdig' ? `✓ ${t.ferdig} · ${fmt(k.total)}` : j.status === 'avbrutt' ? t.avbrutt : `${j.ok} ok · ${j.feil.length} ${t.feilet}`;
      el.innerHTML = `<div class="jobb-hode"><span class="navn">${j.type === 'opp' ? '⤒ ' : '⤓ '}${j.navn}<small>${j.filer.length} ${j.filer.length === 1 ? t.fil : t.filer}</small></span><div class="bar"><i style="width:${j.status === 'ferdig' ? 100 : k.total ? Math.min(100, k.hentet / k.total * 100) : 0}%"></i></div><span class="status">${statusTekst}</span><span class="rad"></span></div><div class="jobb-filer"></div>`;
      const rad = el.querySelector('.rad');
      const knapp = (tekst, cls, fn) => { const b = document.createElement('button'); b.className = 'btn liten ' + (cls || ''); b.textContent = tekst; b.onclick = e => { e.stopPropagation(); fn(); }; rad.appendChild(b); return b; };
      if (j.status === 'laster') knapp(t.avbryt, 'farlig', () => invoke('avbryt'));
      if (j.status === 'feil' || j.status === 'avbrutt') knapp(t.provIgjen, 'primær', () => { j.status = 'kø'; j.feil = []; tegnJobber(); kjørNeste(); });
      // ⋯-meny (Frame.io-inspo): Åpne i Rawskap · Vis i Utforsker · Vis logg · Fjern
      const mk = knapp('⋯', 'meny-knapp', () => { const m = el.querySelector('.meny'); const var_ = m.classList.contains('åpen'); document.querySelectorAll('.meny.åpen').forEach(x => x.classList.remove('åpen')); if (!var_) m.classList.add('åpen'); });
      const meny = document.createElement('div'); meny.className = 'meny';
      const mi = (tekst, fn) => { const b = document.createElement('button'); b.textContent = tekst; b.onclick = e => { e.stopPropagation(); meny.classList.remove('åpen'); fn(); }; meny.appendChild(b); };
      mi(t.apneRawskap, () => openShell(portal + (/rawskap\.no/.test(portal) ? '' : '/rawskap') + (j.mappeId ? `?mappe=${j.mappeId}` : '')));
      mi(t.visUtforsker, () => openShell(j.type === 'opp' ? j.filer[0].sti.replace(/[\\/][^\\/]+$/, '') : j.maal));
      if (j.logg && j.type !== 'opp') mi(t.visLogg, () => openShell(j.maal));
      if (j.status !== 'laster') { meny.appendChild(document.createElement('hr')); mi(t.fjern, () => { jobber.splice(jobber.indexOf(j), 1); tegnJobber(); oppdaterLinje(); }); }
      rad.appendChild(meny);
      el.querySelector('.jobb-hode').onclick = e => { if (e.target.closest('.rad')) return; el.classList.toggle('åpen'); };
      const liste = el.querySelector('.jobb-filer');
      for (const f of j.filer.slice(0, 500)) { const s = filTilstand.get(f.id || f.sti); const r = document.createElement('div'); r.className = 'fil ' + (s?.status || ''); r.id = 'f-' + f.id; r.innerHTML = `<span class="navn" title="${f.sti ? f.sti + '/' : ''}${f.filnavn}">${f.filnavn}</span><div class="bar"><i style="width:${s ? (s.status === 'ferdig' || s.status === 'hoppet' ? 100 : s.total ? Math.min(100, s.hentet / s.total * 100) : 0) : 0}%"></i></div><span class="status">${s ? (s.status === 'ferdig' ? `✓ ${t.ferdig}` : s.status === 'hoppet' ? `✓ ${t.laDer}` : s.status === 'feil' ? `✕ ${s.feil || t.feilet}` : `${fmt(s.hentet)} / ${fmt(s.total)}`) : t.venter}</span>`; liste.appendChild(r); }
      p.appendChild(el);
    }
    oppdaterLinje();
  }
</script>
</body>
</html>
