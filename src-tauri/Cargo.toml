[package]
name = "rawskap-transfer"
version = "0.2.3"
description = "Rawskap Transfer - store overforinger til og fra skapet"
authors = ["Raw Studios AS"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# Auto-oppdatering (30/8): laster ned, VERIFISERER SIGNATUR og installerer i
# appen. Uten signaturen ville en oppdaterings-URL vært en vei rett inn på
# maskinen — derfor nekter pluginen alt som ikke er signert med vår nøkkel.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"
base64 = "0.22"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
dirs = "6"
